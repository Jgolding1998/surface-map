name: Evidence action integration
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  saved-captures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Exercise the composite Action on synthetic saved captures
        id: evidence
        uses: ./
        with:
          before: examples/ci/before.json
          after: examples/ci/after.json
      - name: Verify report semantics
        shell: bash
        run: python -c "import json; r=json.load(open('surface-map-results/comparison.json')); assert r['policy']['passed']; assert len(r['comparison']['added']) == 1; assert len(r['comparison']['changed']) == 1"
      - name: Retain minimized reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: evidence-${{ matrix.os }}
          path: surface-map-results/
          if-no-files-found: ignore
          retention-days: 7
  git-source-evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare actual Surface Map source history without running the selected files
        id: git-evidence
        uses: ./git-action
        with:
          base: 7ec928c281306bc2291c85ca36d431b1cc572dba
          head: ${{ github.sha }}
          javascript-engine: basic
          files: |
            surface_map/static/index.html
            surface_map/static/app.js
      - name: Verify actual-source report scope
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('surface-map-pr-results/comparison.json').read_text())
          assert result['analysis_performed']
          assert result['selection']['selected_files'] == 2
          assert result['policy']['status'] == 'advisory'
          evidence = result['evidence_comparison']
          assert evidence['comparison']['added'] or evidence['asset_comparison']['added']
          assert result['format'] == 'surface-map-git-comparison-v2'
          assert result['review_signals']['format'] == 'surface-map-pr-review-signals-v1'
          assert not result['review_signals']['coverage']['incomplete_sources']
          PY
