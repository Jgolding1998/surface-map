name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - name: Verify local explanations and agent handoffs
        run: node tests/handoff.cjs
      - run: npm ci --ignore-scripts --bin-links=false
        working-directory: analyzers/javascript
      - run: python -c "from surface_map.js_parser import available; ready, reason = available(); assert ready, reason"
      - run: python -m unittest discover -s tests -v
      - name: Basic static-route regression report
        run: python -m evals.run --mode basic --trials 1
      - name: Required syntax static-route regressions
        run: python -m evals.run --mode enhanced --trials 3 --check
      - name: Diverse evidence and comparison regressions
        run: python -m evals.diverse --engine enhanced --repeats 3 --check --output diverse-results.json
      - name: Compare current evidence with the recorded agent baseline
        run: python -m evals.diverse.compare_agent --tool-results diverse-results.json
      - name: 640 scenario combinations
        run: python -m evals.stress640 --engine enhanced --repeats 3 --check --output stress640-results.json
      - name: Verify recorded twenty-case comparison
        run: python -m evals.stress640.agent_comparison --output recorded-comparison.json
      - name: Check comparison record integrity
        run: python -m unittest evals.stress640.agent_comparison.test_record -v
  mcp:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-mcp.txt
      - run: python -m unittest discover -s tests -p test_mcp.py -v
      - run: python -m unittest tests.test_rebuild_interfaces -v
