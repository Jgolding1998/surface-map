name: Local promptfoo evaluations
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'surface_map/**'
      - 'evals/**'
      - 'analyzers/javascript/**'
      - '.github/workflows/promptfoo.yml'
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.1'
      - run: npm ci --ignore-scripts --bin-links=false
        working-directory: analyzers/javascript
      - run: npm ci --ignore-scripts
        working-directory: evals/promptfoo
      - name: Run the local evaluation without model API calls
        run: npm run eval:enhanced
        working-directory: evals/promptfoo
      - name: Retain local public-fixture results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promptfoo-results
          path: evals/promptfoo/results/
          if-no-files-found: ignore
          retention-days: 7
