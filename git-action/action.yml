name: Surface Map changed source evidence
description: Automatically compare selected changed website source from two Git commits without running the target code.
author: Jgolding1998
inputs:
  repository:
    description: Workspace-relative path to the target Git checkout, treated as data.
    default: .
  base:
    description: Full base branch commit SHA; comparison starts at its merge base with head.
    default: ${{ github.event.pull_request.base.sha }}
  head:
    description: Full proposed commit SHA.
    default: ${{ github.event.pull_request.head.sha }}
  files:
    description: Optional newline-separated exact repository-relative source paths, at most six; no glob patterns.
    default: ''
  javascript-engine:
    description: Enhanced syntax analysis or explicit basic hints; enhanced does not silently fall back.
    default: enhanced
  fail-on:
    description: Optional comma-separated added, absent, changed, unresolved, warnings policies. Empty is advisory.
    default: ''
  site-origin-file:
    description: Optional workspace-relative ordinary UTF-8 file containing a first-party origin for classification only. Its value is not printed or fetched.
    default: ''
  output-directory:
    description: New workspace-relative directory for minimized reports; existing directories are refused.
    default: surface-map-pr-results
outputs:
  report-json:
    description: Minimized report JSON path.
    value: ${{ steps.compare.outputs.report-json }}
  report-markdown:
    description: Markdown report path.
    value: ${{ steps.compare.outputs.report-markdown }}
  analysis-performed:
    description: False when no supported source was selected; this is not an all-clear result.
    value: ${{ steps.compare.outputs.analysis-performed }}
  policy-status:
    description: advisory, passed, failed, or not_applicable.
    value: ${{ steps.compare.outputs.policy-status }}
  policy-passed:
    description: true/false only for applied policies; empty for advisory and not_applicable.
    value: ${{ steps.compare.outputs.policy-passed }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      if: inputs.javascript-engine != 'basic'
      with:
        node-version: '24.22.1'
    - name: Install the trusted pinned parser without lifecycle scripts
      if: inputs.javascript-engine != 'basic'
      shell: bash
      working-directory: ${{ github.action_path }}/../analyzers/javascript
      run: npm ci --ignore-scripts --bin-links=false
    - name: Compare Git source as data
      id: compare
      shell: bash
      env:
        SURFACE_MAP_REPOSITORY: ${{ inputs.repository }}
        SURFACE_MAP_BASE: ${{ inputs.base }}
        SURFACE_MAP_HEAD: ${{ inputs.head }}
        SURFACE_MAP_FILES: ${{ inputs.files }}
        SURFACE_MAP_ENGINE: ${{ inputs.javascript-engine }}
        SURFACE_MAP_FAIL_ON: ${{ inputs.fail-on }}
        SURFACE_MAP_SITE_ORIGIN_FILE: ${{ inputs.site-origin-file }}
        SURFACE_MAP_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: python -I -S "$GITHUB_ACTION_PATH/../scripts/git_ci_action.py"
