name: Surface Map evidence comparison
description: Compare two saved web captures and report changes in normalized evidence without executing captured code.
author: Jgolding1998
branding:
  icon: map
  color: blue
inputs:
  before:
    description: Workspace-relative path to the base capture JSON.
    required: true
  after:
    description: Workspace-relative path to the PR capture JSON.
    required: true
  javascript-engine:
    description: JavaScript engine (enhanced, basic, or auto). Enhanced never silently falls back.
    default: enhanced
  fail-on:
    description: Optional comma-separated evidence policies (added,absent,changed,unresolved,warnings). Empty is advisory.
    default: ''
  output-directory:
    description: Workspace-relative directory for minimized JSON and Markdown reports.
    default: surface-map-results
outputs:
  report-json:
    description: Absolute path to the minimized JSON comparison report.
    value: ${{ steps.compare.outputs.report-json }}
  report-markdown:
    description: Absolute path to the Markdown comparison report.
    value: ${{ steps.compare.outputs.report-markdown }}
  policy-passed:
    description: true or false for selected evidence policies; empty for advisory mode.
    value: ${{ steps.compare.outputs.policy-passed }}
  policy-status:
    description: advisory, passed, or failed.
    value: ${{ steps.compare.outputs.policy-status }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11'
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      if: inputs.javascript-engine != 'basic'
      with:
        node-version: '24.22.1'
    - name: Install the pinned parser without lifecycle scripts
      if: inputs.javascript-engine != 'basic'
      shell: bash
      working-directory: ${{ github.action_path }}/analyzers/javascript
      run: npm ci --ignore-scripts --bin-links=false
    - name: Compare supplied captures
      id: compare
      shell: bash
      env:
        SURFACE_MAP_BEFORE: ${{ inputs.before }}
        SURFACE_MAP_AFTER: ${{ inputs.after }}
        SURFACE_MAP_ENGINE: ${{ inputs.javascript-engine }}
        SURFACE_MAP_FAIL_ON: ${{ inputs.fail-on }}
        SURFACE_MAP_OUTPUT_DIRECTORY: ${{ inputs.output-directory }}
      run: python -I -S "$GITHUB_ACTION_PATH/scripts/ci_action.py"
